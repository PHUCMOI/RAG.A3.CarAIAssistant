services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: car_rag
      POSTGRES_USER: car_rag
      POSTGRES_PASSWORD: car_rag_dev
    ports:
      - "5432:5432"
    volumes:
      - car-rag-postgres:/var/lib/postgresql/data
      - ./database/000_extensions.sql:/docker-entrypoint-initdb.d/000_extensions.sql:ro
      - ./database/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
      - ./database/002_add_descriptions.sql:/docker-entrypoint-initdb.d/003_add_descriptions.sql:ro
      - ./database/003_enrich_missing_data.sql:/docker-entrypoint-initdb.d/004_enrich_missing_data.sql:ro
      - ./database/004_seed_dealers.sql:/docker-entrypoint-initdb.d/005_seed_dealers.sql:ro
      - ./database/005_use_curated_image_paths.sql:/docker-entrypoint-initdb.d/006_use_curated_image_paths.sql:ro
      - ./database/006_verify_seed.sql:/docker-entrypoint-initdb.d/007_verify_seed.sql:ro
      - ./database/007_text_rag.sql:/docker-entrypoint-initdb.d/008_text_rag.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_rag -d car_rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://car_rag:car_rag_dev@postgres:5432/car_rag
      FRONTEND_ORIGIN: http://localhost:5173
      RAG_ENABLED: ${RAG_ENABLED:-true}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-base}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-main}
      EMBEDDING_CACHE_DIR: /models/text
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      BEDROCK_TIMEOUT: ${BEDROCK_TIMEOUT:-30}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      OLLAMA_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-90}
    volumes:
      - text-model-cache:/models/text
    ports:
      - "5080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

  orders-api:
    build:
      context: .
      dockerfile: services/owner-features/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OrdersDatabase: Host=postgres;Database=car_rag;Username=car_rag;Password=car_rag_dev
      PythonApiUrl: http://api:8080/
      MigrateOnStartup: "true"
      SeedDemo: "true"
    ports:
      - "127.0.0.1:5090:8080"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
      - orders-api

  image-service:
    profiles: ["image"]
    build:
      context: .
      dockerfile: image_service/Dockerfile
    container_name: autowise-image-service
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      INDEXES_DIR: /app/image_service/indexes
      DATA_DIR: /app/image_service/data
      DATASET_DIR: /app/dataset
    volumes:
      - ./image_service/indexes:/app/image_service/indexes
      - ./image_service/data:/app/image_service/data:ro
      - ./dataset:/app/dataset:ro

volumes:
  car-rag-postgres:
  text-model-cache:

