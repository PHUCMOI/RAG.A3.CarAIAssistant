server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/orders-service/ {
        proxy_pass http://orders-api:8080/api/orders-service/;
        proxy_set_header Host $host;
    }

    location /api/image-service/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $upstream_image http://image-service:8000;
        rewrite ^/api/image-service/(.*) /$1 break;
        proxy_pass $upstream_image;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}

