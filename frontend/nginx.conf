server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/orders-service/ {
        proxy_pass http://orders-api:8080/api/orders-service/;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}

