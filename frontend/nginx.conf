limit_req_zone $binary_remote_addr zone=guest_ai:10m rate=20r/m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 15m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/orders-service/ {
        client_max_body_size 15m;
        proxy_read_timeout 300s;
        set $upstream_orders http://orders-api:8080;
        proxy_pass $upstream_orders;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-AutoWise-Internal-Token "";
    }

    location /api/image-service/ {
        limit_req zone=guest_ai burst=5 nodelay;
        limit_req_status 429;
        set $upstream_image http://image-service:8000;
        rewrite ^/api/image-service/(.*) /$1 break;
        proxy_pass $upstream_image;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-AutoWise-Internal-Token "";
    }

    location ~ ^/api/chat/(compose|understand|title)$ { return 404; }
    location ~ ^/api/chat(?:/turns)?$ {
        limit_req zone=guest_ai burst=5 nodelay;
        limit_req_status 429;
        set $upstream_chat http://api:8080;
        proxy_pass $upstream_chat;
        proxy_set_header Host $host;
        proxy_set_header X-AutoWise-Internal-Token "";
    }

    location /api/ {
        set $upstream_api http://api:8080;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-AutoWise-Internal-Token "";
    }

    location / {
        try_files $uri /index.html;
    }
}

