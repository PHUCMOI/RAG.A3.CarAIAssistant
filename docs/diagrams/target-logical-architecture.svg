<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Target logical architecture</title><desc id="desc">React client connects to a layered FastAPI modular monolith, which uses PostgreSQL, media storage, AI providers, jobs and optional cache.</desc>
  <defs><style>.bg{fill:#f8fafc}.group{fill:#fff;stroke:#94a3b8;stroke-width:2}.box{fill:#e0f2fe;stroke:#0369a1;stroke-width:2}.box2{fill:#ccfbf1;stroke:#0f766e;stroke-width:2}.box3{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.h{fill:#0f172a;font:700 20px Arial}.t{fill:#0f172a;font:700 15px Arial}.s{fill:#475569;font:13px Arial}.a{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#m)}.dash{stroke-dasharray:7 6}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="760" rx="16"/>
  <g transform="translate(40 35)"><rect class="group" width="260" height="160" rx="14"/><text class="h" x="20" y="32">Client</text><g transform="translate(30 60)"><rect class="box2" width="200" height="70" rx="10"/><text class="t" x="63" y="31">React SPA</text><text class="s" x="30" y="53">Public + admin screens</text></g></g>
  <g transform="translate(340 35)"><rect class="group" width="820" height="430" rx="14"/><text class="h" x="20" y="32">FastAPI modular monolith</text>
    <g transform="translate(30 62)"><rect class="box" width="210" height="70" rx="10"/><text class="t" x="47" y="31">HTTP endpoints</text><text class="s" x="31" y="53">Contracts + authorization</text></g>
    <g transform="translate(290 62)"><rect class="box" width="210" height="70" rx="10"/><text class="t" x="36" y="31">Application use cases</text><text class="s" x="37" y="53">Validation + orchestration</text></g>
    <g transform="translate(550 62)"><rect class="box2" width="210" height="70" rx="10"/><text class="t" x="57" y="31">Domain rules</text><text class="s" x="39" y="53">Provider-independent logic</text></g>
    <g transform="translate(30 190)"><rect class="box" width="210" height="70" rx="10"/><text class="t" x="28" y="31">Catalogue query service</text><text class="s" x="46" y="53">Filters + comparison</text></g>
    <g transform="translate(290 190)"><rect class="box2" width="210" height="70" rx="10"/><text class="t" x="40" y="31">Chat orchestration</text><text class="s" x="42" y="53">Retrieval + grounding</text></g>
    <g transform="translate(550 190)"><rect class="box" width="210" height="70" rx="10"/><text class="t" x="58" y="31">Admin service</text><text class="s" x="35" y="53">Mutations + audit trail</text></g>
    <g transform="translate(290 315)"><rect class="box3" width="210" height="70" rx="10"/><text class="t" x="42" y="31">Provider interfaces</text><text class="s" x="50" y="53">AI + media ports</text></g>
  </g>
  <path class="a" d="M300 115H370"/><path class="a" d="M580 132H630"/><path class="a" d="M840 132H890"/><path class="a" d="M735 167V225H580"/><path class="a" d="M735 167V225"/><path class="a" d="M735 167V225H890"/><path class="a" d="M735 295V350"/>
  <g transform="translate(40 515)"><rect class="group" width="1120" height="205" rx="14"/><text class="h" x="20" y="32">Infrastructure</text>
    <g transform="translate(25 65)"><rect class="box3" width="170" height="85" rx="10"/><text class="t" x="25" y="34">PostgreSQL</text><text class="s" x="31" y="59">+ pgvector</text></g><g transform="translate(210 65)"><rect class="box3" width="170" height="85" rx="10"/><text class="t" x="27" y="34">Media storage</text><text class="s" x="30" y="59">Local / object</text></g><g transform="translate(395 65)"><rect class="box3" width="170" height="85" rx="10"/><text class="t" x="38" y="34">LLM provider</text><text class="s" x="34" y="59">Answer generation</text></g><g transform="translate(580 65)"><rect class="box3" width="170" height="85" rx="10"/><text class="t" x="19" y="34">Embedding provider</text><text class="s" x="25" y="59">Text + image vectors</text></g><g transform="translate(765 65)"><rect class="box3" width="170" height="85" rx="10"/><text class="t" x="25" y="34">Background jobs</text><text class="s" x="34" y="59">Async ingestion</text></g><g transform="translate(950 65)"><rect class="box3" width="145" height="85" rx="10"/><text class="t" x="29" y="34">Optional cache</text><text class="s" x="24" y="59">Measured use</text></g>
  </g>
