<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Current AutoWise runtime architecture</title><desc id="desc">Browser talks to React and Nginx, which proxies to the ASP.NET Core API and PostgreSQL. Offline CSV and images feed a Python dataset builder.</desc>
  <defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2}.primary{fill:#0f766e}.secondary{fill:#1d4ed8}.t{fill:#0f172a;font:700 18px Arial}.w{fill:#fff;font:700 18px Arial}.s{fill:#475569;font:14px Arial}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="430" rx="16"/>
  <path class="a" d="M230 125H360"/><text class="s" x="260" y="112">HTTP :5173</text><path class="a" d="M580 125H710"/><text class="s" x="615" y="112">/api proxy</text><path class="a" d="M930 125H1050"/><text class="s" x="965" y="112">Npgsql</text>
  <path class="a" d="M230 330H420"/><text class="s" x="280" y="317">input corpus</text><path class="a" d="M650 330H885V225"/><text class="s" x="690" y="317">generated SQL</text>
  <g transform="translate(40 75)"><rect class="box" width="190" height="100" rx="12"/><text class="t" x="34" y="44">User browser</text><text class="s" x="37" y="72">Vietnamese UI</text></g>
  <g transform="translate(360 65)"><rect class="primary" width="220" height="120" rx="12"/><text class="w" x="40" y="46">Nginx + React</text><text class="w" x="72" y="78">SPA</text><text class="s" style="fill:#ccfbf1" x="46" y="103">Chat screen today</text></g>
  <g transform="translate(710 65)"><rect class="secondary" width="220" height="120" rx="12"/><text class="w" x="30" y="46">ASP.NET Core API</text><text class="s" style="fill:#dbeafe" x="35" y="78">Minimal API + Npgsql</text><text class="s" style="fill:#dbeafe" x="45" y="102">Template chat reply</text></g>
  <g transform="translate(1050 65)"><rect class="box" width="120" height="120" rx="12"/><text class="t" x="16" y="43">PostgreSQL</text><text class="s" x="27" y="72">17 + pgvector</text><text class="s" x="27" y="96">Named volume</text></g>
  <g transform="translate(40 280)"><rect class="box" width="190" height="100" rx="12"/><text class="t" x="35" y="42">CSV + images</text><text class="s" x="30" y="70">Local source dataset</text></g>
  <g transform="translate(420 270)"><rect class="box" width="230" height="120" rx="12"/><text class="t" x="25" y="42">Python data builder</text><text class="s" x="35" y="72">Normalize + validate</text><text class="s" x="32" y="98">Generate seed/migration</text></g>
</svg>
