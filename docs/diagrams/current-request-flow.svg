<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Current chatbot request sequence</title><desc id="desc">React posts a question to the API, which queries CarRepository and PostgreSQL, with a fallback search if no explicit car is mentioned.</desc>
  <defs><style>.bg{fill:#f8fafc}.actor{fill:#0f766e}.actor2{fill:#1d4ed8}.w{fill:#fff;font:700 17px Arial}.life{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7}.call{stroke:#334155;stroke-width:2;marker-end:url(#m)}.ret{stroke:#64748b;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#m)}.txt{fill:#0f172a;font:14px Arial}.alt{fill:#fff7ed;stroke:#f97316;stroke-width:2}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs>
  <rect class="bg" width="1200" height="650" rx="16"/>
  <g transform="translate(70 25)"><rect class="actor" width="180" height="55" rx="10"/><text class="w" x="54" y="34">React UI</text></g><g transform="translate(360 25)"><rect class="actor2" width="180" height="55" rx="10"/><text class="w" x="42" y="34">ASP.NET API</text></g><g transform="translate(660 25)"><rect class="actor" width="180" height="55" rx="10"/><text class="w" x="30" y="34">CarRepository</text></g><g transform="translate(950 25)"><rect class="actor2" width="180" height="55" rx="10"/><text class="w" x="40" y="34">PostgreSQL</text></g>
  <path class="life" d="M160 80V620M450 80V620M750 80V620M1040 80V620"/>
  <path class="call" d="M160 125H450"/><text class="txt" x="235" y="115">POST /api/chat</text><path class="call" d="M450 185H750"/><text class="txt" x="505" y="175">FindMentionedAsync</text><path class="call" d="M750 245H1040"/><text class="txt" x="840" y="235">Parameterized SQL</text><path class="ret" d="M1040 300H750"/><text class="txt" x="850" y="290">Matching cars</text>
  <rect class="alt" x="325" y="345" width="760" height="165" rx="12"/><text class="txt" x="345" y="372" style="font-weight:700">Fallback: no explicit car match</text><path class="call" d="M450 410H750"/><text class="txt" x="545" y="400">SearchAsync</text><path class="call" d="M750 455H1040"/><text class="txt" x="845" y="445">ILIKE + filters</text><path class="ret" d="M1040 490H750"/><text class="txt" x="850" y="480">Candidates</text>
  <path class="ret" d="M450 565H160"/><text class="txt" x="210" y="552">Template answer + contexts</text>
</svg>
